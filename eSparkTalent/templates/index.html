<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eSpark Talent Backend Server</title>
    <style>
        body {
            text-align: center;
        }

        h1 {
            color: #007bff;
            /* Set your desired heading color */
        }

        form {
            margin-top: 20px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #28a745;
            /* Set your desired button background color */
            color: #fff;
            /* Set your desired button text color */
            border: none;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1>eSpark Talent Backend API</h1>

    <form action="/admin/">
        <button type="submit">Go to Admin</button>
    </form>

    <form action="/client_swagger/">
        <button type="submit">Go to Client Swagger</button>
    </form>

    <form action="/employee_swagger/">
        <button type="submit">Go to Employee Swagger</button>
    </form>

    <form action="/hr_swagger/">
        <button type="submit">Go to HR Swagger</button>
    </form>
</body>

</html>
