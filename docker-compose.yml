services:
  api:
    container_name: talent_dashboard_api
    image: "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    environment:
      - SECRET_KEY
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_STORAGE_BUCKET_NAME
      - AWS_S3_ENDPOINT_URL
      - MEDIA_URL
      - TALENT_EMAIL
      - MYSQL_HOST
      - MYSQL_DATABASE
      - MYSQL_PORT
      - MYSQL_USER
      - MYSQL_PASSWORD
      - SUPER_ADMIN_EMAIL
      - SUPER_ADMIN_AUTH
      
    build:
      context: .
      dockerfile: Dockerfile
    command: >
        bash -c "python eSparkTalent/manage.py makemigrations 
        && python eSparkTalent/manage.py migrate 
        && python eSparkTalent/manage.py create_super_user 
        && python eSparkTalent/manage.py runserver 0.0.0.0:${DOCKER_APPLICATION_PORT}"
    ports:
      - ${DOCKER_EXPOSED_PORT}:${DOCKER_APPLICATION_PORT}

    depends_on:
      talent_db:
        condition: service_healthy


  adminer:
    image: adminer
    restart: always
    ports:
      - 7000:8080

  talent_dashboard_db:
    container_name: talent_dashboard_db
    image: mysql:latest
    ports:
      - ${MYSQL_PORT}:${MYSQL_PORT}
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - talent_database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-uroot", "-p${MYSQL_ROOT_PASSWORD}", "-h", "talent_dashboard_db", "-e", "USE ${MYSQL_DATABASE};"]
      retries: 10

volumes:
  talent_database: