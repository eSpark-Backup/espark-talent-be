name: Talent Dashboard Backend CI

on:
  push:
    branches: [ "deployment" ]

jobs:
  build:

    runs-on: dashboardbe-prod
    strategy:
      max-parallel: 4
      matrix:
        python-version: [3.11]
    env:
      AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}}
      AWS_S3_ENDPOINT_URL: ${{ secrets.AWS_S3_ENDPOINT_URL }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_STORAGE_BUCKET_NAME: ${{ secrets.AWS_STORAGE_BUCKET_NAME }}
      MEDIA_URL: ${{ secrets.MEDIA_URL }}
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      TALENT_EMAIL: ${{ secrets.TALENT_EMAIL }}
      
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create env file
        nano .env
        echo AWS_ACCESS_KEY_ID: ${{secrets.AWS_ACCESS_KEY_ID}} >> .env
        echo AWS_S3_ENDPOINT_URL: ${{ secrets.AWS_S3_ENDPOINT_URL }} >> .env
        echo AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }} >> .env
        echo AWS_STORAGE_BUCKET_NAME: ${{ secrets.AWS_STORAGE_BUCKET_NAME }} >> .env
        echo MEDIA_URL: ${{ secrets.MEDIA_URL }} >> .env
        echo SECRET_KEY: ${{ secrets.SECRET_KEY }} >> .env
        echo TALENT_EMAIL: ${{ secrets.TALENT_EMAIL }} >> .env


    - name: Execute Deployment
      run: |
        python eSparkTalent/manage.py migrate
        pm2 start ecosystem.config.json
